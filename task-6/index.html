<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>assignmnet-6</title>
    </head>
    <body>
        <main>
            <section id="task-1">
                <form id="info-form">
                    <div>
                        <label for="name">Name</label>
                        <input id="name" type="text" />
                    </div>
                    <div>
                        <label for="mail">Email</label>
                        <input id="email" type="email" />
                    </div>
                    <div>
                        <button>Submit</button>
                    </div>
                </form>
            </section>
            <hr />
            <section id="task-2">
                <form id="note-form">
                    <textarea name="temp-note" id="temp-note"></textarea>
                    <button>Save Note</button>
                </form>
            </section>
            <hr />
            <section id="task-3">
                <form id="cookie-banner">
                    <p>Do you accept all the Cookies ?</p>
                    <button id="accept-cookies">Accept</button>
                </form>
            </section>
            <hr />
            <section id="task-4">
                <button id="clear-all">Clear All</button>
            </section>
            <hr />
            <section id="task-5">
                <button id="get-joke">Get Joke</button>
                <div id="joke-area"></div>
            </section>
            <hr />
            <section id="task-6">
                <button id="start-countdown">Start Countdown</button>
                <span id="show-countdown"></span>
            </section>
            <hr />
            <section id="task-7">
                <button id="start-ticking">Start Ticking</button>
                <button id="stop-ticking">Stop Ticking</button>
                <div id="tick-area"></div>
            </section>
        </main>
        <script src="main.js"></script>
    </body>
</html>
