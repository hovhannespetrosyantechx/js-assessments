<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet" />
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <main>
            <form>
                <section class="title-section">
                    <h1>Customer Detailes:</h1>
                </section>
                <section class="form-contents">
                    <section class="name-sections">
                        <h2>Full Name <span class="required-sign">*</span></h2>
                        <div class="input-block">
                            <div class="input-item">
                                <input
                                    type="text"
                                    id="firstName"
                                    name="firstName" />
                                <label class="input-label" for="firstName">
                                    First Name
                                </label>
                            </div>
                            <div class="input-item">
                                <input
                                    type="text"
                                    id="lastName"
                                    name="lastName" />
                                <label class="input-label" for="lastName">
                                    Last Name
                                </label>
                            </div>
                        </div>
                        <span class="error"></span>
                    </section>
                    <section class="address-section">
                        <h2>Address <span class="required-sign">*</span></h2>
                        <div class="input-item">
                            <input
                                type="text"
                                id="address-1"
                                name="address-1" />
                            <label class="input-label" for="address-1">
                                Street Address
                            </label>
                        </div>
                        <div class="input-item">
                            <input
                                type="text"
                                id="address-2"
                                name="address-2" />
                            <label class="input-label" for="address-2">
                                Street Address Line 2
                            </label>
                        </div>
                        <div class="input-block">
                            <div class="input-item">
                                <input type="text" id="city" name="city" />
                                <label class="input-label" for="city">
                                    City
                                </label>
                            </div>
                            <div class="input-item">
                                <input type="text" id="state" name="state" />
                                <label class="input-label" for="state">
                                    State / Province
                                </label>
                            </div>
                        </div>
                        <div class="input-item">
                            <input
                                type="text"
                                id="postal-code"
                                name="postal-code" />
                            <label class="input-label" for="postal-code">
                                Postal / Zip Code
                            </label>
                        </div>
                        <span class="error"></span>
                    </section>
                    <section class="phone-section">
                        <h2>
                            Phone Number <span class="required-sign">*</span>
                        </h2>
                        <div class="input-item half">
                            <input
                                type="text"
                                name="phone-number"
                                placeholder="(000) 000-0000"
                                id="phone-Number" />
                        </div>
                        <span class="error"></span>
                    </section>
                    <section class="email-section">
                        <h2>E-mail</h2>
                        <div class="input-item half">
                            <input
                                type="email"
                                name="Email"
                                id="email"
                                placeholder="ex: email@yahoo.com" />
                            <label class="input-label" for="email">
                                example@example.com
                            </label>
                        </div>
                    </section>
                    <hr />
                    <section class="how-section">
                        <h2>
                            How did you hear about us?
                            <span class="required-sign">*</span>
                        </h2>
                        <div class="input-item half">
                            <select id="how" name="select">
                                <option value="#" disabled selected hidden>
                                    Please Select
                                </option>
                                <option value="None">None</option>
                                <option value="Newspaper">Newspaper</option>
                                <option value="Internet">Internet</option>
                                <option value="Magazine">Magazine</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div id="other-section">
                            <div class="input-item half">
                                <input
                                    type="text"
                                    id="other-input"
                                    name="other" />
                                <label for="other-input">Please specify</label>
                                <span class="error"></span>
                            </div>
                        </div>
                    </section>
                    <section class="feedback-section">
                        <h2>Feedback about us</h2>
                        <div class="input-item">
                            <textarea name="feedback" id="feedback"></textarea>
                        </div>
                    </section>
                    <section class="suggestions-section">
                        <h2>Suggestions if any for further improvments</h2>
                        <div class="input-item">
                            <textarea
                                name="suggestions"
                                id="suggestions"></textarea>
                        </div>
                    </section>
                    <section class="recommend-section">
                        <h2>Will you be willing to recommend us?</h2>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input
                                    type="checkbox"
                                    name="recommend"
                                    value="yes"
                                    id="yes" />
                                <span>Yes</span>
                            </label>

                            <label class="checkbox-item">
                                <input
                                    type="checkbox"
                                    name="recommend"
                                    value="maybe"
                                    id="maybe" />
                                Maybe
                            </label>

                            <label class="checkbox-item">
                                <input
                                    type="checkbox"
                                    name="recommend"
                                    value="no"
                                    id="no" />
                                No
                            </label>
                        </div>
                    </section>
                    <section class="reference-section">
                        <h2>
                            Please give reference of any two people whom you
                            feel:
                        </h2>
                        <table class="reference-table">
                            <thead>
                                <tr>
                                    <th id="empty"></th>
                                    <th id="left-top-1">Full Name</th>
                                    <th>Address</th>
                                    <th id="right-top">Contact Number</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th id="left-top-2">1</th>
                                    <td>
                                        <input
                                            id="reference-1-name"
                                            type="text" />
                                    </td>
                                    <td>
                                        <input
                                            id="reference-1-address"
                                            type="text" />
                                    </td>
                                    <td>
                                        <input
                                            id="reference-1-contact"
                                            type="text" />
                                    </td>
                                </tr>
                                <tr>
                                    <th id="left-bottom">2</th>
                                    <td>
                                        <input
                                            id="reference-2-name"
                                            type="text" />
                                    </td>
                                    <td>
                                        <input
                                            id="reference-2-address"
                                            type="text" />
                                    </td>
                                    <td id="right-bottom">
                                        <input
                                            id="reference-2-contact"
                                            type="text" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </section>
                </section>
                <section class="submit-btn">
                    <button type="submit">Submit</button>
                </section>
            </form>
            
        </main>
        <div id="success-screen">
                <img src="success.png" alt="Success" />
            </div>
        <script src="form.js"></script>
    </body>
</html>
